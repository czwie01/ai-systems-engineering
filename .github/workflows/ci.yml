name: CI

on:
  pull_request:
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  validate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.12"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest

      - name: Smoke test CLI
        run: |
          uv run ai-systems list
          uv run ai-systems explain evidence-contracts
          uv run ai-systems run evidence-contracts
          uv run ai-systems explain evaluation-oracle-integrity
          uv run ai-systems run evaluation-oracle-integrity
          uv run ai-systems explain failure-semantics
          uv run ai-systems run failure-semantics
          uv run ai-systems explain ambiguous-completion
          uv run ai-systems run ambiguous-completion
          uv run ai-systems explain operation-provenance
          uv run ai-systems run operation-provenance
